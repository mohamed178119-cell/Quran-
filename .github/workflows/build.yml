name: Build Android APK from Zip

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: unzip -q classwiz-android-project.zip -d extracted

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Find Project Root
        run: |
          # البحث عن جذر المشروع
          PROJECT_ROOT=$(find ./extracted -name "settings.gradle" -type f | head -n 1)
          
          if [ -z "$PROJECT_ROOT" ]; then
            PROJECT_ROOT=$(find ./extracted -name "build.gradle" -type f | head -n 1)
          fi
          
          if [ -z "$PROJECT_ROOT" ]; then
            echo "Error: لم يتم العثور على settings.gradle أو build.gradle!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$PROJECT_ROOT")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "وجدت جذر المشروع في: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          echo "البناء من: $(pwd)"
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk

      - name: Debug Info
        if: failure()
        run: |
          echo "=== جذر المشروع ==="
          echo "$PROJECT_DIR"
          echo "=== محتويات المشروع ==="
          ls -la "$PROJECT_DIR"
          echo "=== البحث عن gradle files ==="
          find ./extracted -name "*.gradle" -type f
