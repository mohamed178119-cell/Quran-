name: Build Android APK from Zip

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: unzip -q classwiz-android-project.zip -d extracted

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and Build APK
        run: |
          # 1. البحث التلقائي عن مسار gradlew
          GRADLEW_PATH=$(find ./extracted -name "gradlew" | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew not found in the zip file!"
            exit 1
          fi
          
          echo "Found gradlew at: $GRADLEW_PATH"
          
          # 2. الدخول إلى المجلد الصحيح الذي يحتوي على الملف
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          
          # 3. إعطاء الصلاحيات وبناء التطبيق
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
