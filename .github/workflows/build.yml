name: Build Android APK from Zip

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: unzip -q classwiz-android-project.zip -d extracted

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # إضافة إعدادات Gradle الرسمية لاستخدامها كبديل
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Find and Build APK
        run: |
          # 1. البحث عن أقصر مسار يحتوي على ملف settings.gradle أو build.gradle (والذي يمثل الجذر الأساسي للمشروع)
          PROJECT_ROOT=$(find ./extracted -name "settings.gradle" | head -n 1)
          
          if [ -z "$PROJECT_ROOT" ]; then
            PROJECT_ROOT=$(find ./extracted -name "build.gradle" | awk '{ print length, $0 }' | sort -n | cut -d" " -f2- | head -n 1)
          fi
          
          if [ -z "$PROJECT_ROOT" ]; then
            echo "Error: Could not find build.gradle or settings.gradle! This might not be a valid Android project."
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$PROJECT_ROOT")
          echo "Found Android project root at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # 2. استخدام أداة gradle العامة في السيرفر بدلاً من gradlew المحلي
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
