name: Build Android APK from Zip

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: unzip -q classwiz-android-project.zip -d extracted

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and Build APK
        run: |
          # البحث عن gradlew أولاً
          GRADLEW_FILE=$(find ./extracted -name "gradlew" -type f | head -n 1)
          
          if [ -z "$GRADLEW_FILE" ]; then
            echo "Error: لم يتم العثور على gradlew!"
            echo "=== محتويات extracted ==="
            find ./extracted -type f -name "*.gradle*" | head -10
            find ./extracted -type f -name "gradlew*"
            ls -la ./extracted/
            exit 1
          fi
          
          # الحصول على المسار الصحيح
          PROJECT_DIR=$(dirname "$GRADLEW_FILE")
          echo "وجدت gradlew في: $GRADLEW_FILE"
          echo "سيتم البناء من: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # إعطاء الصلاحيات وبناء APK
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk

      - name: Debug Info
        if: failure()
        run: |
          echo "=== البحث عن جميع ملفات gradle ==="
          find ./extracted -name "*gradle*" -type f
          echo "=== هيكل المشروع ==="
          find ./extracted -maxdepth 3 -type f | head -30
