name: Build Android APK from Zip

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: unzip -q classwiz-android-project.zip -d extracted

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Check Gradle Version
        run: |
          cd extracted
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            cat gradle/wrapper/gradle-wrapper.properties
          fi
          ls -la gradle/wrapper/ 2>/dev/null || echo "No gradle wrapper directory found"

      - name: Create Gradle Wrapper with Version 7.5.1
        run: |
          cd extracted
          # تحميل أداة gradle wrapper
          if [ ! -f "gradlew" ]; then
            echo "Creating gradle wrapper..."
            # تحديد إصدار gradle 7.5.1 (متوافق مع معظم مشاريع Android)
            mkdir -p gradle/wrapper
            cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-7.5.1-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
            
            # تحميل وإنشاء gradlew
            gradle --version || true
            # استخدام gradle من النظام لإنشاء wrapper
            gradle wrapper --gradle-version=7.5.1 2>/dev/null || {
              # إذا فشل، قم بتحميل gradlew مباشرة
              wget -q https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradlew -O gradlew
              wget -q https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradlew.bat -O gradlew.bat
              chmod +x gradlew
            }
          fi
          chmod +x gradlew
          ls -la gradlew

      - name: Build APK
        run: |
          cd extracted
          ./gradlew clean assembleDebug --stacktrace --no-daemon -x lint

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk

      - name: Debug Info
        if: failure()
        run: |
          echo "=== Project Structure ==="
          find ./extracted -maxdepth 2 -type f -name "*.gradle*" -o -name "*.properties"
          echo ""
          echo "=== JDK Version ==="
          java -version
          echo ""
          echo "=== Gradle Version ==="
          cd extracted && ./gradlew --version 2>/dev/null || gradle --version
