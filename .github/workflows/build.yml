name: Build Android APK from Zip

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: unzip -q classwiz-android-project.zip -d extracted

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Find and Build APK
        run: |
          # البحث عن جذر المشروع الصحيح
          PROJECT_ROOT=$(find ./extracted -name "settings.gradle" | head -n 1)
          
          if [ -z "$PROJECT_ROOT" ]; then
            PROJECT_ROOT=$(find ./extracted -name "build.gradle" | awk '{ print length, $0 }' | sort -n | cut -d" " -f2- | head -n 1)
          fi
          
          if [ -z "$PROJECT_ROOT" ]; then
            echo "Error: لم يتم العثور على build.gradle أو settings.gradle!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$PROJECT_ROOT")
          echo "وجدت جذر المشروع في: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # بناء APK
          chmod +x gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk

      - name: Debug Info
        if: failure()
        run: |
          echo "=== البحث عن ملفات gradle ==="
          find ./extracted -name "*.gradle" -type f
          echo "=== محتويات extracted ==="
          ls -la ./extracted/
